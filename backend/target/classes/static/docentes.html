<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Docentes | SBSG</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/tables.css">
</head>
<body>
  <div class="app-wrapper">
    <!-- Sidebar Navigation Centralizado -->
    <aside id="app-sidebar" class="sidebar"></aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="top-bar">
        <div class="page-title-group">
          <h1>Directorio y Gestión de Docentes</h1>
          <p>Registre nuevos profesores, edite sus datos y administre su estado</p>
        </div>
        <div class="top-bar-actions">
          <button type="button" id="btn-nuevo-docente" class="btn btn-primary" style="display:inline-flex; align-items:center; gap:6px;">
            <i class="fa-solid fa-user-plus"></i> Nuevo Docente
          </button>
        </div>
      </header>

      <div class="content-container">
        
        <!-- Barra de Búsqueda y Filtro -->
        <div class="filter-bar">
          <div class="filter-item" style="flex-grow: 2;">
            <label for="search-docente">Buscar Docente</label>
            <input type="text" id="search-docente" class="form-control" placeholder="Buscar por nombre completo del docente...">
          </div>

          <div class="filter-item">
            <label for="filter-estado-docente">Estado</label>
            <select id="filter-estado-docente" class="form-control">
              <option value="">Todos los estados</option>
              <option value="activo" selected>Solo Activos</option>
              <option value="inactivo">Solo Inactivos</option>
            </select>
          </div>
        </div>

        <!-- Tabla de Docentes -->
        <div class="card" style="padding: 0; overflow: hidden;">
          <div style="padding: 12px 16px; border-bottom: 1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight: 700; color: var(--primary);">Listado de Profesores Institucionales</span>
            <span id="total-docentes-badge" class="badge" style="background:#ebf8ff; color:var(--primary); font-size:12px;">-</span>
          </div>

          <div class="table-responsive" style="border:none; border-radius:0;">
            <table class="data-table">
              <thead>
                <tr>
                  <th style="width: 60px;">ID</th>
                  <th>Nombre Completo del Docente</th>
                  <th style="text-align:center; width: 130px;">Estado</th>
                  <th style="text-align:center; width: 190px;">Acciones</th>
                </tr>
              </thead>
              <tbody id="docentes-tbody">
                <tr>
                  <td colspan="4" style="text-align:center; padding: 24px; color: var(--text-muted);">
                    Cargando docentes...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Modal para Crear / Editar Docente -->
  <div id="modal-docente" class="modal-backdrop">
    <div class="modal-content">
      <div class="modal-header">
        <div id="modal-docente-title" class="modal-title">Registrar Nuevo Docente</div>
        <button type="button" class="btn-icon" id="btn-cerrar-modal" style="font-size: 16px;"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="form-docente">
        <div class="modal-body">
          <input type="hidden" id="docente-id">

          <div class="form-group" style="margin-bottom: 16px;">
            <label class="form-label" for="docente-nombre-completo">
              Nombre Completo <span class="required">*</span>
            </label>
            <input type="text" id="docente-nombre-completo" class="form-control" placeholder="Ej: PÉREZ LÓPEZ JUAN CARLOS" required>
          </div>

          <div class="form-group">
            <label class="radio-label">
              <input type="checkbox" id="docente-activo" checked> Docente Activo en la Institución
            </label>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" id="btn-cancelar-docente">Cancelar</button>
          <button type="submit" class="btn btn-primary btn-sm" id="btn-guardar-docente" style="display:inline-flex; align-items:center; gap:6px;"><i class="fa-solid fa-floppy-disk"></i> Guardar Docente</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/docentes.js"></script>
</body>
</html>
