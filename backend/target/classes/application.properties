# ==========================================================
# CONFIGURACIÓN DEL SISTEMA DE CONTINGENCIAS SBSG
# ==========================================================
spring.application.name=contingencias-sbsg

# Configuración DataSource con H2 embebido persistente
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/sbsg_contingencias_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Configuración Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Puerto del Servidor
server.port=8080

# Recursos Estáticos en Vivo (Servidos directamente de /frontend en tiempo real)
spring.web.resources.static-locations=file:./frontend/,classpath:/static/
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# Ruta del Archivo Excel para sincronización / seed
app.excel.file-path=recursos/documentos_fuente/Contingencias 2026.xlsx

# Subida de archivos
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
