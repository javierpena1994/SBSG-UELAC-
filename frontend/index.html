<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Aplicaciones | SBSG</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      background: radial-gradient(circle at 50% 25%, #1e293b 0%, #0f172a 65%, #020617 100%);
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 36px 20px 28px 20px;
      color: #ffffff;
      user-select: none;
    }

    /* Top Search Bar & Title */
    .top-search-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-top: 12px;
    }

    .school-title-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    .search-box-wrapper {
      position: relative;
      width: 100%;
      max-width: 320px;
    }

    .search-box-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.45);
      font-size: 13px;
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 8px 14px 8px 36px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      color: #ffffff;
      font-size: 13.5px;
      outline: none;
      backdrop-filter: blur(16px);
      transition: all 0.2s ease;
      text-align: left;
    }

    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .search-input:focus {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.45);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
    }

    /* Launchpad App Grid - 3 Apps */
    .launchpad-container {
      width: 100%;
      max-width: 800px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto 0;
      padding: 30px 0;
    }

    .apps-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 56px 48px;
      width: 100%;
      max-width: 720px;
      justify-items: center;
    }

    @media (max-width: 680px) {
      .apps-grid {
        grid-template-columns: 1fr;
        gap: 32px;
      }
    }

    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #ffffff;
      cursor: pointer;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
      width: 170px;
      text-align: center;
    }

    .app-item:hover {
      transform: scale(1.09);
    }

    .app-item:active {
      transform: scale(0.96);
    }

    .app-icon {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      margin-bottom: 14px;
      box-shadow: 0 14px 28px -4px rgba(0, 0, 0, 0.5), 0 4px 10px -2px rgba(0, 0, 0, 0.35);
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.16);
      transition: box-shadow 0.2s ease;
    }

    .app-item:hover .app-icon {
      box-shadow: 0 18px 36px -4px rgba(0, 0, 0, 0.65), 0 0 24px rgba(255, 255, 255, 0.25);
    }

    /* Icon Gradients */
    .icon-contingencias {
      background: linear-gradient(145deg, #3b82f6 0%, #1d4ed8 50%, #1e3a8a 100%);
      color: #ffffff;
    }

    .icon-examenes {
      background: linear-gradient(145deg, #d946ef 0%, #a855f7 50%, #6b21a8 100%);
      color: #ffffff;
    }

    .icon-cronograma {
      background: linear-gradient(145deg, #22c55e 0%, #16a34a 50%, #14532d 100%);
      color: #ffffff;
    }

    .app-title {
      font-size: 14.5px;
      font-weight: 600;
      color: #f8fafc;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
      letter-spacing: 0.2px;
      line-height: 1.3;
    }

    .app-subtitle {
      font-size: 11.5px;
      color: #94a3b8;
      margin-top: 3px;
    }

    /* Footer & Page Dots */
    .launchpad-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .page-dots {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
    }

    .dot.active {
      background: #ffffff;
    }

    .footer-text {
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.4px;
    }
  </style>
</head>
<body>

  <!-- Top Search Bar & Branding -->
  <div class="top-search-section">
    <div class="school-title-badge">
      <i class="fa-solid fa-graduation-cap"></i> UNIDAD EDUCATIVA "LOLA AROSEMENA DE CARBO"
    </div>
  <br>
  <br>
  <br>
  <br>
  <br>
  <br>
  <!-- Launchpad App Grid (Only 3 Apps) -->
  <main class="launchpad-container">
    <div class="apps-grid" id="apps-grid">
      
      <!-- App 1: Generador de Contingencias -->
      <a href="contingencias_dashboard.html" class="app-item" data-name="contingencias reemplazos ausencias profesores">
        <div class="app-icon icon-contingencias">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <div class="app-title">GESTIÓN DE CONTIGENCIAS</div>
        <div class="app-subtitle">Reemplazos Docentes</div>
      </a>

      <!-- App 2: Horarios de Exámenes -->
      <a href="examenes.html" class="app-item" data-name="examenes evaluaciones pruebas sorteo horarios cursos">
        <div class="app-icon icon-examenes">
          <i class="fa-solid fa-dice"></i>
        </div>
        <div class="app-title">HORARIO DE EXÁMENES</div>
        <div class="app-subtitle">Sorteo y Asignación</div>
      </a>

      <!-- App 3: Cronograma de Actividades -->
      <a href="cronograma.html" class="app-item" data-name="cronograma calendario actividades eventos fechas">
        <div class="app-icon icon-cronograma">
          <i class="fa-solid fa-calendar-days"></i>
        </div>
        <div class="app-title">CRONOGRAMA DE ACTIVIDADES</div>
        <div class="app-subtitle">Planificación Institucional</div>
      </a>

    </div>
  </main>

  <!-- Launchpad Footer -->
  <footer class="launchpad-footer">
    <div class="page-dots">
      <div class="dot active"></div>
    </div>
    <div class="footer-text">
      Sociedad de Beneficencia de Señoras de Guayaquil
    </div>
    <div class="footer-text">
      Desarrollado por J. Peña
    </div>
  </footer>

  <script>
    // Live Search Filter
    const searchInput = document.getElementById('app-search');
    const appItems = document.querySelectorAll('.app-item');

    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      appItems.forEach(item => {
        const name = (item.dataset.name || '') + ' ' + item.querySelector('.app-title').textContent.toLowerCase();
        if (name.includes(q)) {
          item.style.display = 'flex';
          item.style.opacity = '1';
        } else {
          item.style.display = 'none';
          item.style.opacity = '0';
        }
      });
    });

    // Enter key launches first matched app
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const visibleApps = Array.from(appItems).filter(item => item.style.display !== 'none');
        if (visibleApps.length > 0) {
          window.location.href = visibleApps[0].getAttribute('href');
        }
      }
    });
  </script>
</body>
</html>
